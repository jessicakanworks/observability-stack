global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: ["rules/*.yml"]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: node
    file_sd_configs: [{files: ["targets/node_*.yml"]}]
  - job_name: jvm
    metrics_path: /actuator/prometheus
    file_sd_configs: [{files: ["targets/jvm_*.yml"]}]
  - job_name: snmp
    metrics_path: /snmp
    params: {module: [if_mib]}
    file_sd_configs: [{files: ["targets/snmp_*.yml"]}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "snmp-exporter:9116"}
  - job_name: blackbox_http
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs: [{files: ["targets/http_*.yml"]}]
